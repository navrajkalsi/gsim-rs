[package]
name = "gsim-rs"
version = "2.0.0"
edition = "2024"
description = "A G-code simulator written in Rust."
repository = "https://github.com/navrajkalsi/gsim-rs"
license = "MIT OR Apache-2.0"
keywords = ["gcode", "parsing", "simulation", "tui", "wgpu"]
categories = ["command-line-utilities", "rendering", "simulation"]
exclude = ["gcodes", "media"]

[[bench]]
harness = false
name = "source_bench"

[[bench]]
harness = false
name = "lexer_bench"

[[bench]]
harness = false
name = "parser_bench"

[[bench]]
harness = false
name = "interpreter_bench"

[[bench]]
harness = false
name = "geometry_bench"

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11.10"
image = "0.25.10"
log = "0.4.30"
pollster = "0.4.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
wgpu = "29.0.1"
winit = "0.30.13"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[target.'cfg(windows)'.dependencies.winapi-util]
version = "0.1.6"
